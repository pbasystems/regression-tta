adapt_dataloader:
  batch_size: 256
  shuffle: true
dataset:
  config:
    combine_splits_for_stats: true
    feature_cols: all_24
    last_window_only: false
    max_rul: 125.0
    norm_mode: minmax
    normalize_rul: false
    source_domain: false
    source_fd: FD001
    source_split: train
    target_fd: FD002
    target_split: test
    window_size: 30
  name: cmapss
evaluator:
  compile_model: null
optimizer:
  config:
    lr: 0.0001
    weight_decay: 0.0
  name: Adam
  param: fe
regressor:
  config:
    f_size: 64
    input_size: 24
    lstm_dropout: 0.5
    lstm_hidden_size: 128
    num_layers: 1
    regressor_dropout: 0.3
    regressor_first_hidden_size: 32
    regressor_second_hidden_size: 0
  source: result/source/cmapss_fd001_fd002
  type: lstm_dann
tta:
  config:
    compile_model: null
    loss_config:
      eps: 1.0e-08
    pc_config:
      contrib_top_k: 5
      stat_file: result/source/cmapss_fd001_fd002/feature_stats.pt
    train_mode: false
    weight_bias: 1.0
    weight_exp: 1.0
  type: pca
val_dataloader:
  batch_size: 256
wandb:
  project: Regression-TTA
  run_name: FD001-to-FD002 | TTA
  use_wandb: true
