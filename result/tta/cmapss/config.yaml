adapt_dataloader:
  batch_size: 64
  shuffle: true
dataset:
  config:
    max_rul: 125.0
    normalize_rul: false
    source_domain: false
    source_fd: FD001
    source_split: train
    standardize: true
    target_fd: FD003
    target_split: train
    window_size: 1
  name: cmapss
evaluator:
  compile_model: null
optimizer:
  config:
    lr: 0.0001
    weight_decay: 0.0
  name: Adam
  param: fe
regressor:
  config:
    h_dims: 100
    in_dims: 14
    n_rep: 4
  source: result/source/cmapss/source_model_14550.pt
  type: table
tta:
  config:
    compile_model: null
    loss_config:
      eps: 1.0e-08
    pc_config:
      contrib_top_k: 5
      stat_file: result/source/cmapss/feature_stats.pt
    train_mode: false
    weight_bias: 1.0
    weight_exp: 1.0
  type: pca
val_dataloader:
  batch_size: 256
