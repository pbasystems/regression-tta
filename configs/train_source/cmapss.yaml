epoch: 50

dataset:
  name: cmapss
  config:
    source_domain: true
    standardize: true
    source_fd: FD001
    target_fd: FD003
    source_split: train
    target_split: train
    max_rul: 125.0
    normalize_rul: false
    window_size: 1
  train_ratio: 0.9

regressor:
  type: table
  config:
    in_dims: 14
    h_dims: 100
    n_rep: 4

optimizer:
  param: all
  name: Adam
  config:
    lr: 1.0e-3
    weight_decay: 5.0e-4

trainer:
  compile_model: &compile_model null

evaluator:
  compile_model: *compile_model

train_dataloader:
  batch_size: 64
  shuffle: true

val_dataloader:
  batch_size: 256
