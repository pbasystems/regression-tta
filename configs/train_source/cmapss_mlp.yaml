epoch: 200

early_stopping:
  enabled: true
  patience: 20
  min_delta: 1.0e-4

wandb:
  use_wandb: true
  project: Regression-TTA
  run_name: FD001-to-FD002 | MLP Source-Train

dataset:
  name: cmapss
  config:
    source_domain: true
    norm_mode: minmax
    combine_splits_for_stats: true
    source_fd: FD001
    target_fd: FD002
    source_split: train
    target_split: train
    feature_cols: sensors_14
    max_rul: 125.0
    normalize_rul: false
    window_size: 1
  train_ratio: 0.9
  split_by_engine: true

regressor:
  type: table
  config:
    in_dims: 14
    h_dims: 100
    n_rep: 4

optimizer:
  param: all
  name: Adam
  config:
    lr: 1.0e-3
    weight_decay: 5.0e-4

trainer:
  compile_model: &compile_model null

evaluator:
  compile_model: *compile_model

train_dataloader:
  batch_size: 64
  shuffle: true

val_dataloader:
  batch_size: 256
