wandb:
  use_wandb: true
  project: Regression-TTA
  run_name: FD001-to-FD002 | MLP Feature-Stats

dataset:
  name: cmapss
  config:
    source_domain: true
    norm_mode: minmax
    combine_splits_for_stats: true
    source_fd: FD001
    target_fd: FD002
    source_split: train
    target_split: train
    feature_cols: sensors_14
    max_rul: 125.0
    normalize_rul: false
    window_size: 1
  train_ratio: 0.9
  split_by_engine: true

regressor:
  source: result/source/cmapss_mlp
  type: table
  config:
    in_dims: 14
    h_dims: 100
    n_rep: 4

calculator:
  compile_model: null

dataloader:
  batch_size: 256
