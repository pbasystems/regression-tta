dataset:
  name: cmapss
  config:
    source_domain: true
    norm_mode: minmax
    combine_splits_for_stats: true
    source_fd: FD001
    target_fd: FD002
    source_split: train
    target_split: train
    feature_cols: all_24
    max_rul: 125.0
    normalize_rul: false
    window_size: 30
  train_ratio: 0.9
  split_by_engine: true

regressor:
  source: result/source/cmapss_fd001_fd002
  type: lstm_dann
  config:
    input_size: 24
    lstm_hidden_size: 128
    f_size: 64
    num_layers: 1
    lstm_dropout: 0.5
    regressor_dropout: 0.3
    regressor_first_hidden_size: 32
    regressor_second_hidden_size: 0

calculator:
  compile_model: null

dataloader:
  batch_size: 256
